<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSOMA – Gestión de Documentos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root { --accent:#4f46e5; --accent-dark:#3730a3; --gold:#F5A623; }
body { background:#f5f4ff; font-family:'Segoe UI',sans-serif; }
.navbar { background:var(--accent)!important; }
.navbar-brand { font-weight:700; color:#fff!important; letter-spacing:.4px; }
.btn-accent  { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-accent:hover { background:var(--accent-dark); border-color:var(--accent-dark); color:#fff; }
.card { border:1px solid #e0dff5; border-radius:12px; }
.badge-ok    { background:#dcfce7; color:#166534; font-size:11px; }
.badge-falta { background:#fee2e2; color:#991b1b; font-size:11px; }
.badge-na    { background:#f3f4f6; color:#6b7280; font-size:11px; }
.flash-wrap  { position:fixed; top:66px; right:16px; z-index:9999; min-width:280px; }
.item-row:hover { background:#f0f0ff; }
.section-title { background:var(--gold); padding:6px 12px; font-weight:700; font-size:13px; border-radius:6px 6px 0 0; }
</style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-2">
  <a class="navbar-brand" href="/"><i class="bi bi-shield-check me-2"></i>SSOMA Docs – METASIL</a>
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-wrap">
  {% for cat, msg in messages %}
  <div class="alert alert-{{ 'success' if cat=='success' else ('warning' if cat=='warning' else 'danger') }} alert-dismissible fade show shadow-sm">
    {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
