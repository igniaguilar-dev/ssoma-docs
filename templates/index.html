{% extends 'base.html' %}
{% block content %}
<div class="container py-4" style="max-width:680px;">
  <h4 class="fw-bold mb-4"><i class="bi bi-building me-2 text-primary"></i>Obras / Proyectos</h4>

  <div class="card shadow-sm mb-4 p-3">
    <p class="fw-semibold mb-2" style="font-size:14px;">Nueva obra</p>
    <form method="POST" action="/obra/nueva" class="d-flex gap-2">
      <input type="text" name="nombre" class="form-control" placeholder="Ej: Obra Callao 2026" required>
      <button class="btn btn-accent px-4">Crear</button>
    </form>
  </div>

  {% if obras %}
  <div class="d-flex flex-column gap-2">
    {% for o in obras %}
    <a href="/obra/{{ o.id }}" class="text-decoration-none">
      <div class="card shadow-sm p-3 d-flex flex-row align-items-center justify-content-between item-row">
        <div class="d-flex align-items-center gap-3">
          <div style="width:42px;height:42px;border-radius:10px;background:#e0e7ff;display:flex;align-items:center;justify-content:center;">
            <i class="bi bi-building text-primary fs-5"></i>
          </div>
          <div>
            <p class="fw-semibold mb-0 text-dark">{{ o.nombre }}</p>
            <p class="text-muted mb-0" style="font-size:12px;">Creada el {{ o.created_at[:10] }}</p>
          </div>
        </div>
        <i class="bi bi-chevron-right text-muted"></i>
      </div>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="text-center py-5 text-muted">
    <i class="bi bi-folder-x fs-1 d-block mb-2"></i>
    No hay obras registradas. Crea la primera arriba.
  </div>
  {% endif %}
</div>
{% endblock %}
